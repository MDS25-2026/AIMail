# Render Blueprint (specs/features/free-hosting.md): one web service runs the agent on loopback and the API
# with the worker, and Presidio runs as a private service no one outside Render can reach. Secrets are
# filled in Render's dashboard (sync: false), never here. Migrations run from a developer machine with
# `make migrate`. The listener runs as a background worker; only one listener may run, so stop the
# laptop's once this one is up.
services:
  - type: web
    name: aimail-backend
    runtime: docker
    # Starter (0.5 CPU): on free's 0.1 CPU, startup took a minute and every click lagged.
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./start-render.sh
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: prod
      # Internal to the service: the API calls the agent on 127.0.0.1.
      - key: AGENT_TOKEN
        generateValue: true
      # For scripts and curl only; never put it in a VITE_ variable.
      - key: BACKEND_API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Account deletion removes the Supabase sign-in (app/account.py).
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Must be the same values the laptop's listener uses, or stored connections and vaults will not open.
      # Use TOKEN_ENCRYPTION_KEYS / PII_VAULT_KEYS instead if the laptop uses keyrings.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PII_VAULT_KEY
        sync: false
      # https://<app>.vercel.app/api : the browser reaches the backend through the dashboard's rewrite.
      - key: BACKEND_PUBLIC_URL
        sync: false
      # https://<app>.vercel.app
      - key: DASHBOARD_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ADMIN_ORIGINS
        sync: false
      # http://<aimail-presidio's internal address>/analyze, from that service's page (Connect, Internal).
      - key: PRESIDIO_ANALYZER_URL
        sync: false

  # Masks names in typed text and uploads for the backend; needs about 2 GB. Private: reachable only from
  # services in the same region, so it needs no password.
  - type: pserv
    name: aimail-presidio
    runtime: image
    plan: standard
    region: singapore
    image:
      # The same pinned image as docker-compose.yml: this image decides what counts as a name.
      url: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    envVars:
      - key: PORT
        value: 3000

  # Pulls Gmail's notifications from Pub/Sub, masks each email and stores it. No port: a worker.
  - type: worker
    name: aimail-listener
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./listener/Dockerfile
    dockerContext: ./listener
    envVars:
      # Pub/Sub signs in as a service account: upload its JSON key as a Secret File named pubsub-sa.json.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/pubsub-sa.json
      - key: GCP_PROJECT_ID
        sync: false
      - key: PUBSUB_TOPIC
        sync: false
      - key: PUBSUB_SUBSCRIPTION
        sync: false
      # The same values as the backend's, copied from it so they can never drift apart.
      - key: SUPABASE_URL
        fromService: { type: web, name: aimail-backend, envVarKey: SUPABASE_URL }
      - key: SUPABASE_SERVICE_KEY
        fromService: { type: web, name: aimail-backend, envVarKey: SUPABASE_SERVICE_KEY }
      - key: TOKEN_ENCRYPTION_KEY
        fromService: { type: web, name: aimail-backend, envVarKey: TOKEN_ENCRYPTION_KEY }
      - key: PII_VAULT_KEY
        fromService: { type: web, name: aimail-backend, envVarKey: PII_VAULT_KEY }
      - key: GOOGLE_OAUTH_CLIENT_ID
        fromService: { type: web, name: aimail-backend, envVarKey: GOOGLE_OAUTH_CLIENT_ID }
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        fromService: { type: web, name: aimail-backend, envVarKey: GOOGLE_OAUTH_CLIENT_SECRET }
      - key: GOOGLE_API_KEY
        fromService: { type: web, name: aimail-backend, envVarKey: GOOGLE_API_KEY }
      - key: PRESIDIO_ANALYZER_URL
        fromService: { type: web, name: aimail-backend, envVarKey: PRESIDIO_ANALYZER_URL }

