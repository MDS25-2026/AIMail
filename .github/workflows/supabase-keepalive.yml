name: Supabase keep-alive

# The free plan pauses a project after about 7 idle days. One tiny read every two days keeps it
# active until the project moves to Pro. RLS answers the publishable key with no rows, but the
# query still reaches Postgres, which is what counts as activity.
permissions: {}

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/messages?select=id&limit=1"
