name: CI

# Least privilege: CI only reads the repo, never writes.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # constraints.txt pins what make check last passed with; the floors alone let CI drift.
      - run: pip install -r requirements.txt -c constraints.txt
      - run: ruff check app tests scripts *.py
      - run: pytest -q
      # The image the backend and agent ship in; its .dockerignore keeps the study data out.
      - run: docker build -t aimail-backend:ci .

  database:
    # Migrations and the schema's own guarantees (RLS, the append-only audit chain, atomic rate
    # counters) against a real Postgres with pgvector, which the unit tests above cannot show.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a  # pg16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      AIMAIL_ENV_FILE: ""
      DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -c constraints.txt
      # Twice: the second run must find nothing pending, so a migration that is not idempotent fails here.
      - run: python scripts/migrate.py
      - run: python scripts/migrate.py
      - run: pytest -q tests/test_database.py

  api-types:
    # The dashboard's types are generated from the backend's schema; a stale copy fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/mail-clarity-dash-main/package-lock.json
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend/frontend/mail-clarity-dash-main
      - run: python scripts/dump_openapi.py .openapi.json
        working-directory: backend
        env:
          AIMAIL_ENV_FILE: ""
      - run: npx openapi-typescript ../../../backend/.openapi.json -o ../../../backend/.schema.check.ts
        working-directory: frontend/frontend/mail-clarity-dash-main
      - run: diff -q backend/.schema.check.ts frontend/frontend/mail-clarity-dash-main/src/lib/api/schema.gen.ts || (echo "API types are stale - run make api-types" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend/mail-clarity-dash-main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/mail-clarity-dash-main/package-lock.json
      # npm ci: exactly the lockfile, and a lock out of step with package.json fails instead of drifting.
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
      # WCAG contrast and colour-blind separation for the palette, and that src/palette.css was
      # regenerated from it. Stdlib Python, preinstalled on the runner.
      - run: python3 scripts/check-palette.py

  listener:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener
    # The same pinned images as docker-compose.yml, so the masking recall gate scores the NER layer
    # too; REQUIRE_PRESIDIO makes an unreachable container a failure, never a silent skip.
    services:
      presidio-analyzer:
        image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
        env:
          PORT: "5001"
        ports: ["5001:5001"]
      presidio-anonymizer:
        image: mcr.microsoft.com/presidio-anonymizer@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
        env:
          PORT: "5002"
        ports: ["5002:5002"]
    env:
      REQUIRE_PRESIDIO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: listener/go.mod
      - run: go build ./...
      - run: go vet ./...
      # The analyzer loads its language models before it answers.
      - name: wait for presidio
        run: |
          for _ in $(seq 1 60); do
            curl -fs localhost:5001/health && curl -fs localhost:5002/health && exit 0
            sleep 2
          done
          echo "presidio did not become healthy"; exit 1
      # The live tests skip themselves: no Presidio, reader or Gemini key exists in CI.
      - run: go test ./...
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "unformatted files above; run gofmt -w ."
            exit 1
          fi

  attachment-reader:
    # The privacy gates run against the real Tesseract and spaCy models, so the tests run inside
    # the image they ship in. The base image is large; this is the slow job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener/attachment-reader
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t aimail-attachment-reader:ci .
      - run: >-
          docker run --rm --user root --entrypoint sh aimail-attachment-reader:ci
          -c 'pip install -q pytest && python -m pytest -q -p no:warnings tests'
