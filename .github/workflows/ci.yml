name: CI

# Least privilege: CI only reads the repo, never writes.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend/mail-clarity-dash-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/mail-clarity-dash-main/package-lock.json
      # npm install (not the stricter `npm ci`) so a lock generated by a different npm version
      # still resolves — the lock/npm-version pinning isn't worth the CI friction here.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  listener:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: listener/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "unformatted files above; run gofmt -w ."
            exit 1
          fi
