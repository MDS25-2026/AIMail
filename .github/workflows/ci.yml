name: CI

# Least privilege: CI only reads the repo, never writes.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # constraints.txt pins what make check last passed with; the floors alone let CI drift.
      - run: pip install -r requirements.txt -c constraints.txt
      - run: ruff check app tests scripts *.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend/mail-clarity-dash-main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/mail-clarity-dash-main/package-lock.json
      # npm install (not the stricter `npm ci`) so a lock generated by a different npm version
      # still resolves — the lock/npm-version pinning isn't worth the CI friction here.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      # WCAG contrast and colour-blind separation for the palette, and that src/palette.css was
      # regenerated from it. Stdlib Python, preinstalled on the runner.
      - run: python3 scripts/check-palette.py

  listener:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: listener/go.mod
      - run: go build ./...
      - run: go vet ./...
      # The live tests skip themselves: no Presidio, reader or Gemini key exists in CI.
      - run: go test ./...
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "unformatted files above; run gofmt -w ."
            exit 1
          fi

  attachment-reader:
    # The privacy gates run against the real Tesseract and spaCy models, so the tests run inside
    # the image they ship in. The base image is large; this is the slow job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener/attachment-reader
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t aimail-attachment-reader:ci .
      - run: >-
          docker run --rm --user root --entrypoint sh aimail-attachment-reader:ci
          -c 'pip install -q pytest && python -m pytest -q -p no:warnings tests'
